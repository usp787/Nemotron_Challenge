# Mirror of Kaggle's published eval params, used to predict leaderboard
# accuracy locally. Drift from these numbers will misrepresent the score.
#
# Source: Kaggle competition page, "Evaluation" section, table of metric
# parameters. Fixed by the host; we cannot change them at submission time.

model:
  name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
  dtype: bfloat16
  max_model_len: 8192
  max_tokens: 7680
  temperature: 0.0
  top_p: 1.0
  trust_remote_code: true

runtime:
  backend: vllm
  gpu_memory_utilization: 0.85
  tensor_parallel_size: 1
  max_num_seqs: 64
  # LoRA hookup. Set lora.path to the trained adapter directory to evaluate
  # the adapted model; leave it null to evaluate base behavior under the
  # same eval params (useful for a paired baseline number).
  lora:
    enabled: true
    path: outputs/lora_adapter
    max_lora_rank: 32
    max_loras: 1

data:
  # Stratified holdout across all 6 Kaggle categories (~100 per category,
  # excluding any prompt used in data/sft_traces.jsonl). Built by
  # scripts/build_stratified_holdout.py. Replaces the single-category
  # numeral_holdout.jsonl which scored 100% locally regardless of training
  # config and gave no signal on cipher / bit_manipulation /
  # equation_numeric — see memory:feedback_holdout_must_be_stratified.
  input_path: data/stratified_holdout.jsonl
  output_dir: outputs
  # Match THK's training+inference prompt shape. MUST stay aligned with
  # build_sft_traces.py, which now appends the suffix by default for reasoner
  # rows; otherwise the inference distribution diverges from training and
  # per-category accuracy collapses on format-sensitive tasks
  # (bit_manipulation, cryptarithm). Flip off only when you deliberately
  # rebuild training data with --no-append-thk-suffix.
  append_thk_suffix: true

logging:
  save_prompt: true
  save_latency: true
  save_errors: true
