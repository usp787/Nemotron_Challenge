# Base-model eval using the same Kaggle-style decoding params as
# configs/eval_kaggle.yaml, but with LoRA disabled.
#
# Use this for a paired comparison against outputs/lora_eval_<JOB_ID>.jsonl.

model:
  name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
  dtype: bfloat16
  max_model_len: 8192
  max_tokens: 7680
  temperature: 0.0
  top_p: 1.0
  trust_remote_code: true

runtime:
  backend: vllm
  gpu_memory_utilization: 0.85
  tensor_parallel_size: 1
  max_num_seqs: 64
  lora:
    enabled: false
    path: null
    max_lora_rank: 32
    max_loras: 1

data:
  input_path: data/numeral_holdout.jsonl
  output_dir: outputs

logging:
  save_prompt: true
  save_latency: true
  save_errors: true
