# Phase 6 production training config — full THK 04-10-04-33 recipe.
#
# This is the smoke_train.yaml recipe with the 20-step cap relaxed for a
# production run on data/sft_combined.jsonl (17,391 records). Every other
# field is byte-for-byte identical to configs/smoke_train.yaml so that the
# smoke validates the *exact* config that runs here.
#
# Provenance: THK's released training config at training/sft/04-10-04-33/
# in the read-only mirror (decision + 4-signal rationale recorded in
# docs/rebuild_checklist.md Phase 8).
#
# PRODUCTION RUN PATH (path-beta chunked):
#   Smoke job 6710260 measured ~230 sec/optimizer-step on a single H200.
#   245 THK-equivalent steps × 230 s ≈ 15.7 hours, exceeding the gpu
#   partition's 8h walltime cap. Path beta splits the run into 3 SLURM
#   jobs of ~82 steps each (cumulative 246 ≈ THK's 245 natural stop).
#   See docs/path_beta_runbook.md for the operational sequence; submit
#   slurm/train_thk_chunk.slurm three times with THK_CHUNK_IDX=1/2/3.
#
# DELTAS vs configs/smoke_train.yaml:
#   - train.max_steps: 20 -> 246     (cumulative target across 3 chunks;
#     each chunk overrides this via --max-steps CLI to its own ceiling
#     of 82 / 164 / 246)
#   - train.logging_steps: 1 (kept)  — loss-curve watch needs fine grain
#   - output.adapter_dir:
#       outputs/lora_adapter_smoke -> outputs/lora_adapter_thk
#     Per-chunk SLURM overrides this via --output-dir to
#       outputs/lora_adapter_thk_chunk{1,2,3} so chunks don't clobber.
#
# WHAT IS *NOT* CHANGED (these came in via the smoke and are locked):
#   - lora.r = 32                              (THK match; was 16 in lora_verification.yaml)
#   - train.gradient_accumulation_steps = 64   (effective batch 64; THK match)
#   - train.lr_scheduler = linear              (THK match; was cosine)
#   - train.warmup_ratio = 0.0                 (THK has no warmup)
#   - train.adam_beta2 = 0.95                  (THK match; HF default is 0.999)
#   - data.input_path = data/sft_combined.jsonl

model:
  name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
  dtype: bfloat16
  trust_remote_code: true

lora:
  r: 32
  alpha: 32
  dropout: 0.0
  # Explicit target_modules list = the 8 names peft's "all-linear" sentinel
  # resolved to on this base model (verified in chunk3's adapter_config.json
  # from the failed 2026-05-14 submission) PLUS lm_head.
  #
  # Why not `modules_to_save: [lm_head]` (the previous approach)?
  #   peft's `modules_to_save` stores a FULL-RANK replacement weight for the
  #   listed module under the key `...lm_head.modules_to_save.default.weight`.
  #   vLLM's LoRA adapter loader (which Kaggle's hidden harness uses — see
  #   [[kaggle_eval_contract]]) only understands the low-rank A/B
  #   decomposition. With `modules_to_save` set, vLLM either rejects the
  #   adapter_config.json or chokes on the full-rank tensor key — surfaced
  #   to us on 2026-05-14 as "Evaluation metric raised an unexpected error"
  #   on a 4.24 GB adapter_model.safetensors.
  #
  # Why this fixes it:
  #   Adding `lm_head` to target_modules applies the same rank-32 LoRA
  #   decomposition vLLM already loads for the other 8 modules. The output
  #   projection still gets trained (the goal — bit_manipulation needs 0/1
  #   token-bias correction; see [[milestone_2026-05-13]] Fix A), but as a
  #   low-rank delta vLLM can apply. Adapter size drops from ~4.2 GB to a
  #   few hundred MB.
  #
  # Trade-off vs THK's `train_unembed: true` (which is full-rank): we get
  # a rank-32 approximation of the unembedding update, not the full thing.
  # For a vocab-size output projection this is the closest vLLM-compatible
  # equivalent; if results disappoint we can revisit (Option C in the
  # 2026-05-14 diagnosis: strip lm_head from the existing adapter instead).
  target_modules: [v_proj, q_proj, in_proj, up_proj, out_proj, k_proj, down_proj, o_proj, lm_head]
  bias: none
  task_type: CAUSAL_LM

data:
  input_path: data/sft_combined.jsonl
  max_seq_len: 8192
  mask_user_loss: true

train:
  num_epochs: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 64
  learning_rate: 2.0e-4
  lr_scheduler: linear
  warmup_ratio: 0.0
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8
  gradient_checkpointing: true
  bf16: true
  logging_steps: 1
  save_steps: 0
  seed: 42

  # Cumulative target across all path-beta chunks. 246 sits 1 step above
  # THK 04-10-04-33's 245-step natural stop, leaving the final-step LR at
  # ~1.85e-5 (= 2e-4 * (25/271)) — close to but not yet zero on the linear
  # decay over the 271-step "one full epoch" basis. Each chunk's SLURM
  # invocation passes a per-chunk --max-steps {82,164,246} that overrides
  # this for THIS process; the value here is the final-chunk target.
  max_steps: 246

output:
  adapter_dir: outputs/lora_adapter_thk
